<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #bfc9c3;
            border-radius: 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-sm antialiased selection:bg-primary/20 selection:text-primary">
<!-- Top App Bar (Suppressed based on intent, replaced with a specific contextual header) -->
<header class="fixed top-0 w-full z-50 bg-background/90 backdrop-blur-md px-margin-page py-4 flex justify-between items-center h-20">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary absolute left-1/2 -translate-x-1/2">提取通知</h1>
<div class="w-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-margin-page max-w-2xl mx-auto flex flex-col gap-stack-lg min-h-[calc(100vh-80px)]">
<!-- Input Area Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_8px_24px_rgba(11,77,61,0.05)] flex flex-col gap-stack-md relative h-[442px]">
<label class="font-label-caps text-label-caps text-primary flex items-center gap-2" for="notice-input">
<span class="material-symbols-outlined text-lg" data-icon="content_paste">content_paste</span>
                粘贴文本
            </label>
<textarea class="w-full h-full resize-none border-0 bg-surface/50 rounded-lg p-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="notice-input" placeholder="粘贴一段校园通知，我来帮你整理..."></textarea>
<!-- Floating Clear Button inside textarea area -->
<button aria-label="Clear text" class="absolute bottom-6 right-6 w-10 h-10 rounded-full bg-error-container text-on-error-container hover:bg-error hover:text-on-error transition-colors shadow-sm flex items-center justify-center z-10">
<span class="material-symbols-outlined text-[20px]" data-icon="delete_sweep">delete_sweep</span>
</button>
</div>
<!-- Action Area -->
<div class="flex flex-col gap-stack-md mt-auto">
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary rounded-full py-4 px-8 font-body-lg text-body-lg shadow-[0_8px_16px_rgba(0,53,40,0.15)] hover:opacity-90 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined icon-fill" data-icon="magic_button">magic_button</span>
                开始识别
            </button>
<!-- Helper Text -->
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-2">
                    没内容？ 
                    <button class="text-primary font-body-sm text-body-sm hover:underline flex items-center gap-1 group">
                        试试示例
                        <span class="material-symbols-outlined text-[16px] group-hover:translate-x-0.5 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</p>
</div>
</div>
</main>
<!-- Bottom Nav Bar (Suppressed based on contextual/transactional intent) -->
<!-- The prompt implies a specific task (pasting and extracting), so global nav is hidden to maintain focus. -->
</body></html>
