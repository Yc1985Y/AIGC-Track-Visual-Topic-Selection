<body class="bg-background text-on-background min-h-screen relative overflow-x-hidden selection:bg-primary-fixed selection:text-on-primary-fixed">

<header class="fixed top-0 w-full z-50 bg-background/80 dark:bg-background/80 backdrop-blur-xl transition-all duration-200">
<div class="flex justify-between items-center px-margin-page py-4 w-full">

</div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed font-extrabold tracking-tight">Hi, Elizabeth</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary dark:text-primary-fixed-dim hover:opacity-70 transition-opacity active:scale-95 duration-200 bg-surface-container-low/50">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-[100px] pb-[120px] px-margin-page flex flex-col gap-stack-lg max-w-2xl mx-auto">
<!-- Header for showcase -->
<div class="mb-stack-sm text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">State Guidelines</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Playful Academicism Empty States</p>
</div>
<!-- 1. Empty State: No Tasks Today -->
<section class="bg-surface-container rounded-xl p-8 flex flex-col items-center justify-center text-center shadow-[0_8px_24px_rgba(11,77,61,0.05)] relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent opacity-50 pointer-events-none"></div>
<div class="w-48 h-48 mb-6 relative z-10">
<img alt="Cute illustration of an empty desk" class="w-full h-full object-cover rounded-full shadow-lg border-4 border-surface-container-lowest" data-alt="A minimalist 3D illustration of a neat, empty wooden desk with a single small potted plant and a warm, glowing table lamp. The scene is rendered in a soft, playful style with rounded edges and pastel colors, fitting a cozy study companion app. The background is a very soft, creamy off-white. The lighting is diffused and inviting, suggesting a peaceful, task-free afternoon." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdYGqfDr7vQgh99kDEiGqucBDv6P3U1yxUBIPAhZxoKRGFFCdHBpJ6xldFDYnWTZr4-Wf8rY2lLm58jY7l6MB19SxC9iCfIIRUrdowi7A1qpp0DulI_gWokAsGNRRyUN8tcVSbiBMpIZF366JvIyDiX9leO39F-IyUnleJBGO7IIU2Ac8VwogWDOvkCw_WjsqYjvdOn9LnV653LRxVP6a4Qr-M_e5GDMRUcUM_JlUCpJA7WzN454QQLv2ic7D7XXAvZQymTh8rryuC"/>
</div>
<h3 class="font-headline-md text-headline-md text-primary mb-3 relative z-10">暂无今日安排</h3>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8 max-w-[250px] relative z-10">
                太棒了！所有的任务都已经搞定啦。给自己泡杯茶放松一下吧。
            </p>
<button class="bg-primary text-on-primary font-label-caps text-label-caps px-8 py-4 rounded-full shadow-md hover:opacity-90 hover:shadow-lg transition-all active:scale-95 duration-200 relative z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
                添加新计划
            </button>
</section>
<!-- 2. Permission Guidance -->
<section class="bg-tertiary-fixed rounded-xl p-8 flex flex-col items-center justify-center text-center shadow-[0_8px_24px_rgba(11,77,61,0.05)] relative overflow-hidden">
<div class="absolute inset-0 bg-white/20 backdrop-blur-sm pointer-events-none"></div>
<div class="w-24 h-24 mb-6 rounded-full bg-white/50 flex items-center justify-center text-tertiary relative z-10 shadow-inner">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">no_photography</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-tertiary-fixed-variant mb-3 relative z-10">请给个权限吧</h3>
<p class="font-body-sm text-body-sm text-tertiary mb-8 max-w-[260px] relative z-10">
                我们需要访问相机才能帮你扫描和分析错题哦。去设置里开启一下吧~
            </p>
<button class="bg-tertiary text-on-tertiary font-label-caps text-label-caps px-8 py-4 rounded-full shadow-md hover:bg-tertiary/90 transition-all active:scale-95 duration-200 relative z-10">
                去设置开启
            </button>
</section>
<!-- 3. Recognition Failed -->
<section class="bg-surface-variant rounded-xl p-8 flex flex-col items-center justify-center text-center shadow-[0_8px_24px_rgba(11,77,61,0.05)] relative overflow-hidden">
<div class="absolute -right-10 -top-10 w-40 h-40 bg-surface-container-highest rounded-full blur-2xl opacity-60 pointer-events-none"></div>
<div class="absolute -left-10 -bottom-10 w-32 h-32 bg-primary-fixed rounded-full blur-2xl opacity-40 pointer-events-none"></div>
<div class="w-24 h-24 mb-6 rounded-full bg-primary-fixed-dim/30 flex items-center justify-center text-primary relative z-10 border border-primary-fixed">
<span class="material-symbols-outlined text-[40px]">search_off</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-3 relative z-10">哎呀，没找到信息...</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-8 max-w-[240px] relative z-10">

            </p>
<div class="flex gap-4 w-full justify-center relative z-10">
<button class="bg-white/60 text-primary font-label-caps text-label-caps px-6 py-4 rounded-full hover:bg-white/80 transition-all active:scale-95 duration-200 border border-white">
                    手动输入
                </button>
<button class="bg-primary text-on-primary font-label-caps text-label-caps px-6 py-4 rounded-full shadow-md hover:opacity-90 transition-all active:scale-95 duration-200">
                    重新拍照
                </button>
</div>
</section>

<div class="flex justify-around items-center w-full px-4 pb-6 pt-4">
<!-- Active Tab: 首页 -->
<button class="flex flex-col items-center justify-center bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container rounded-full px-6 py-2 hover:opacity-90 transition-all active:scale-90 duration-150 group">
<span class="material-symbols-outlined mb-1 transition-transform group-active:scale-90" style="font-variation-settings: 'FILL' 1;">home</span>

<!-- Inactive Tab: 时间线 -->

</button>
