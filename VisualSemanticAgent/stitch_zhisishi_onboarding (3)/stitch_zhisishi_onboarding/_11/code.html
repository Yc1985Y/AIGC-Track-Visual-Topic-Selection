<style>
          .bg-dots {
              background-image: radial-gradient(#97d3bd 2px, transparent 2px);
              background-size: 20px 20px;
          }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-sm bg-dots">
<!-- Main Content Area - Full height to center content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-page relative overflow-hidden">
<!-- Decorative Background Elements (Abstract Shapes) -->
<div class="absolute top-10 left-[-20%] w-[150%] h-64 bg-primary-fixed opacity-30 rounded-[100%] blur-3xl -z-10"></div>
<div class="absolute bottom-10 right-[-20%] w-96 h-96 bg-secondary-fixed opacity-40 rounded-full blur-3xl -z-10"></div>
<!-- Central Glassmorphism Card for Loading Content -->
<div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-xl p-8 w-full max-w-sm shadow-[0_8px_32px_rgba(11,77,61,0.08)] flex flex-col items-center text-center relative border border-surface-container-highest/50">
<!-- Playful Illustration / Animation Placeholder -->
<div class="w-48 h-48 mb-stack-lg relative flex items-center justify-center">
<!-- Abstract "Scanning" or "Processing" Visual -->
<div class="absolute inset-0 bg-primary-fixed/20 rounded-full animate-pulse"></div>
<div class="absolute w-32 h-32 bg-primary-container rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-primary text-6xl" style="font-variation-settings: 'FILL' 1;">
                        document_scanner
                    </span>
</div>
<!-- Floating Elements around the central icon -->
<div class="absolute top-0 right-4 bg-secondary-container w-8 h-8 rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-secondary-container text-sm font-bold">schedule</span>
</div>
<div class="absolute bottom-4 left-0 bg-surface-dim w-10 h-10 rounded-xl flex items-center justify-center shadow-sm transform rotate-12">
<span class="material-symbols-outlined text-on-surface text-lg font-bold">location_on</span>
</div>
<div class="absolute top-12 left-2 bg-primary-fixed w-6 h-6 rounded-md flex items-center justify-center shadow-sm transform -rotate-12">
<span class="material-symbols-outlined text-primary-container text-xs font-bold">check</span>
</div>
</div>
<!-- Primary Loading Message -->
<h1 class="font-display-lg text-display-lg text-primary mb-stack-sm w-full">
                正在整理通知...
            </h1>
<!-- Secondary Status Details -->
<div class="flex flex-col gap-2 mt-stack-md w-full">
<div class="flex items-center gap-3 bg-surface-container/50 p-3 rounded-lg w-full">
<span class="material-symbols-outlined text-primary-container">search</span>
<p class="font-body-lg text-body-lg text-on-surface-variant flex-1 text-left">正在识别事项</p>
<span class="material-symbols-outlined text-primary text-sm animate-spin">progress_activity</span>
</div>
<div class="flex items-center gap-3 bg-surface-container/30 p-3 rounded-lg w-full">
<span class="material-symbols-outlined text-outline">schedule</span>
<p class="font-body-sm text-body-sm text-outline flex-1 text-left">时间、地点...</p>
</div>
<div class="flex items-center gap-3 bg-surface-container/30 p-3 rounded-lg w-full">
<span class="material-symbols-outlined text-outline">hourglass_empty</span>
<p class="font-body-sm text-body-sm text-outline flex-1 text-left">很快就好</p>
</div>
</div>
<!-- Custom Progress Bar -->
<div class="w-full mt-stack-lg">
<div class="h-3 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-2/3 relative">
<!-- Shimmer effect on progress bar -->
<div class="absolute top-0 right-0 bottom-0 left-0 bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full animate-[shimmer_2s_infinite]"></div>
</div>
</div>
</div>
</div>
<!-- Cancel Action (Bottom, out of the card to signify aborting the whole process) -->
<div class="mt-stack-lg w-full max-w-sm px-4">
<button class="w-full py-4 rounded-full bg-surface-container-highest text-on-surface-variant font-label-caps text-label-caps tracking-widest flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors shadow-sm">
<span class="material-symbols-outlined text-lg">close</span>
                取消
            </button>
</div>
</main>
</body></html>
