<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>导出日程</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdad4",
                        "primary": "#003528",
                        "background": "#fff8f2",
                        "outline-variant": "#bfc9c3",
                        "secondary-fixed": "#ffdad8",
                        "on-tertiary-fixed": "#370e08",
                        "inverse-surface": "#402d00",
                        "surface-container-highest": "#ffdea1",
                        "on-tertiary-container": "#e79f93",
                        "on-surface": "#261900",
                        "surface-dim": "#ffd47e",
                        "on-primary-container": "#82bda8",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#97d3bd",
                        "primary-fixed": "#b2efd9",
                        "on-surface-variant": "#404945",
                        "on-background": "#261900",
                        "surface-bright": "#fff8f2",
                        "inverse-on-surface": "#ffefd5",
                        "on-tertiary-fixed-variant": "#6c3830",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#97d3bd",
                        "on-secondary-fixed": "#410007",
                        "secondary": "#9e3f42",
                        "error": "#ba1a1a",
                        "surface-container-low": "#fff2df",
                        "surface-container": "#ffebcb",
                        "surface-variant": "#ffdea1",
                        "primary-container": "#0b4d3d",
                        "surface": "#fff8f2",
                        "on-primary-fixed-variant": "#105040",
                        "secondary-container": "#fe8989",
                        "on-secondary-fixed-variant": "#7f282c",
                        "tertiary-fixed-dim": "#ffb4a8",
                        "surface-container-high": "#ffe5b6",
                        "outline": "#707975",
                        "on-error": "#ffffff",
                        "tertiary": "#4e2019",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#ffb3b1",
                        "on-primary-fixed": "#002118",
                        "tertiary-container": "#69352d",
                        "surface-tint": "#2e6857",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#762125"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-page": "24px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "stack-sm": "8px",
                        "gutter-grid": "16px"
                    },
                    "fontFamily": {
                        "body-sm": [
                            "Plus Jakarta Sans"
                        ],
                        "label-caps": [
                            "Lexend"
                        ],
                        "headline-md": [
                            "Plus Jakarta Sans"
                        ],
                        "display-lg": [
                            "Plus Jakarta Sans"
                        ],
                        "body-lg": [
                            "Plus Jakarta Sans"
                        ]
                    },
                    "fontSize": {
                        "body-sm": [
                            "14px",
                            {
                                "lineHeight": "20px",
                                "fontWeight": "400"
                            }
                        ],
                        "label-caps": [
                            "12px",
                            {
                                "lineHeight": "16px",
                                "letterSpacing": "0.05em",
                                "fontWeight": "600"
                            }
                        ],
                        "headline-md": [
                            "24px",
                            {
                                "lineHeight": "32px",
                                "fontWeight": "700"
                            }
                        ],
                        "display-lg": [
                            "36px",
                            {
                                "lineHeight": "44px",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "800"
                            }
                        ],
                        "body-lg": [
                            "18px",
                            {
                                "lineHeight": "28px",
                                "fontWeight": "500"
                            }
                        ]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg min-h-screen pb-32">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-margin-page py-4 w-full bg-background/80 dark:bg-background/80 backdrop-blur-xl fixed top-0 w-full z-50">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">Export Schedule</h1>
</div>
<button class="text-on-surface-variant hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-2xl">help_outline</span>
</button>
</header>
<main class="pt-24 px-margin-page space-y-stack-lg max-w-2xl mx-auto">
<!-- Export Preview Card (Glassmorphism) -->
<section class="bg-surface-container-highest/40 backdrop-blur-md rounded-xl p-6 shadow-[0_8px_24px_rgba(11,77,61,0.05)] border border-surface-container-highest/20">
<div class="flex justify-between items-center mb-stack-md">
<h2 class="font-body-lg text-body-lg text-primary">Preview</h2>
<span class="font-label-caps text-label-caps bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full">Real-time</span>
</div>
<div class="bg-surface-container-lowest rounded-lg p-4 shadow-sm border border-outline-variant/30 flex flex-col items-center justify-center min-h-[200px]">
<span class="material-symbols-outlined text-4xl text-primary-fixed-dim mb-2">calendar_month</span>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">Schedule preview will appear here based on your selection.</p>
</div>
</section>
<!-- Format Selection -->
<section>
<h2 class="font-body-lg text-body-lg text-on-background mb-stack-sm">Format</h2>
<div class="grid grid-cols-3 gap-gutter-grid">
<!-- PDF Selected -->
<button class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-lg p-4 shadow-md transition-all hover:opacity-90">
<span class="material-symbols-outlined filled text-3xl mb-2">picture_as_pdf</span>
<span class="font-label-caps text-label-caps">PDF</span>
</button>
<!-- JPG Unselected -->
<button class="flex flex-col items-center justify-center bg-surface-container rounded-lg p-4 text-on-surface-variant hover:bg-surface-variant/50 transition-all border border-transparent hover:border-outline-variant/30">
<span class="material-symbols-outlined text-3xl mb-2">image</span>
<span class="font-label-caps text-label-caps">JPG</span>
</button>
<!-- PNG Unselected -->
<button class="flex flex-col items-center justify-center bg-surface-container rounded-lg p-4 text-on-surface-variant hover:bg-surface-variant/50 transition-all border border-transparent hover:border-outline-variant/30">
<span class="material-symbols-outlined text-3xl mb-2">photo_library</span>
<span class="font-label-caps text-label-caps">PNG</span>
</button>
</div>
</section>
<!-- Date Range Selection -->
<section>
<h2 class="font-body-lg text-body-lg text-on-background mb-stack-sm">Date Range</h2>
<div class="flex flex-wrap gap-stack-sm">
<!-- Today Unselected -->
<button class="font-label-caps text-label-caps px-6 py-3 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-variant/50 transition-all border border-outline-variant/20">
                    Today
                </button>
<!-- This Week Selected -->
<button class="font-label-caps text-label-caps px-6 py-3 rounded-full bg-secondary-container text-on-secondary-container shadow-sm transition-all border border-transparent">
                    This Week
                </button>
<!-- This Month Unselected -->
<button class="font-label-caps text-label-caps px-6 py-3 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-variant/50 transition-all border border-outline-variant/20">
                    This Month
                </button>
</div>
</section>
<!-- Export Action Button -->
<div class="pt-stack-md">
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg py-4 rounded-full shadow-[0_8px_16px_rgba(0,53,40,0.15)] hover:shadow-[0_4px_8px_rgba(0,53,40,0.2)] hover:opacity-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined filled">file_download</span>
                Export Now
            </button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-3">File will be saved to your device.</p>
</div>
</main>
<!-- Success Toast (Hidden by default, shown for demonstration) -->
<div class="fixed bottom-32 left-1/2 transform -translate-x-1/2 bg-surface-tint text-on-primary font-body-sm text-body-sm px-6 py-3 rounded-full flex items-center gap-2 shadow-lg z-50">
<span class="material-symbols-outlined filled text-sm">check_circle</span>
        Export successful!
    </div>
</body></html>
