<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Recognition Result</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdad4",
                        "primary": "#003528",
                        "background": "#fff8f2",
                        "outline-variant": "#bfc9c3",
                        "secondary-fixed": "#ffdad8",
                        "on-tertiary-fixed": "#370e08",
                        "inverse-surface": "#402d00",
                        "surface-container-highest": "#ffdea1",
                        "on-tertiary-container": "#e79f93",
                        "on-surface": "#261900",
                        "surface-dim": "#ffd47e",
                        "on-primary-container": "#82bda8",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#97d3bd",
                        "primary-fixed": "#b2efd9",
                        "on-surface-variant": "#404945",
                        "on-background": "#261900",
                        "surface-bright": "#fff8f2",
                        "inverse-on-surface": "#ffefd5",
                        "on-tertiary-fixed-variant": "#6c3830",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#97d3bd",
                        "on-secondary-fixed": "#410007",
                        "secondary": "#9e3f42",
                        "error": "#ba1a1a",
                        "surface-container-low": "#fff2df",
                        "surface-container": "#ffebcb",
                        "surface-variant": "#ffdea1",
                        "primary-container": "#0b4d3d",
                        "surface": "#fff8f2",
                        "on-primary-fixed-variant": "#105040",
                        "secondary-container": "#fe8989",
                        "on-secondary-fixed-variant": "#7f282c",
                        "tertiary-fixed-dim": "#ffb4a8",
                        "surface-container-high": "#ffe5b6",
                        "outline": "#707975",
                        "on-error": "#ffffff",
                        "tertiary": "#4e2019",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#ffb3b1",
                        "on-primary-fixed": "#002118",
                        "tertiary-container": "#69352d",
                        "surface-tint": "#2e6857",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#762125"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-page": "24px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "stack-sm": "8px",
                        "gutter-grid": "16px"
                    },
                    "fontFamily": {
                        "body-sm": ["Plus Jakarta Sans"],
                        "label-caps": ["Lexend"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-surface-container-low/80 backdrop-blur-xl border border-surface-container-highest/30 shadow-[0_8px_32px_rgba(11,77,61,0.05)];
            }
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            .material-symbols-outlined.filled {
                font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-sm pb-24 selection:bg-primary/20">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl transition-all duration-300">
<div class="flex justify-between items-center px-margin-page py-4 w-full max-w-screen-md mx-auto">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-variant transition-colors text-primary">
<span aria-hidden="true" class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-extrabold tracking-tight">Edit Details</h1>
<button aria-label="More options" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-70 transition-opacity">
<span aria-hidden="true" class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="pt-24 px-margin-page max-w-screen-md mx-auto space-y-stack-lg">
<!-- Header Section -->
<section class="space-y-stack-sm">
<div class="inline-flex items-center gap-2 bg-secondary-fixed/50 px-4 py-1.5 rounded-full text-secondary font-label-caps text-label-caps uppercase">
<span class="material-symbols-outlined text-[16px]">auto_awesome</span>
                Recognized from image
            </div>
<p class="font-body-lg text-body-lg text-on-surface-variant">Please review and adjust the details extracted from your scan.</p>
</section>
<!-- Form Form -->
<form class="space-y-stack-md glass-panel rounded-lg p-6">
<!-- Event Name -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase pl-2" for="eventName">Event Name</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="absolute left-4 material-symbols-outlined text-primary/60">edit_note</span>
<input class="w-full bg-surface/50 border-none rounded-full py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-on-surface-variant/40" id="eventName" placeholder="Enter event name" type="text" value="Advanced Accounting Seminar"/>
</div>
</div>
<!-- Date Selection -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase pl-2" for="eventDate">Date</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="absolute left-4 material-symbols-outlined text-primary/60">calendar_today</span>
<input class="w-full bg-surface/50 border-none rounded-full py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface transition-all appearance-none cursor-pointer" id="eventDate" type="date" value="2024-07-23"/>
</div>
</div>
<!-- Time Selection (Grid for Start/End) -->
<div class="grid grid-cols-2 gap-gutter-grid">
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase pl-2" for="startTime">Start Time</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="absolute left-4 material-symbols-outlined text-primary/60">schedule</span>
<input class="w-full bg-surface/50 border-none rounded-full py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface transition-all appearance-none cursor-pointer" id="startTime" type="time" value="09:00"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase pl-2" for="endTime">End Time</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="absolute left-4 material-symbols-outlined text-primary/60">update</span>
<input class="w-full bg-surface/50 border-none rounded-full py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface transition-all appearance-none cursor-pointer" id="endTime" type="time" value="11:30"/>
</div>
</div>
</div>
<!-- Location -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase pl-2" for="eventLocation">Location</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="absolute left-4 material-symbols-outlined text-primary/60">location_on</span>
<input class="w-full bg-surface/50 border-none rounded-full py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-on-surface-variant/40" id="eventLocation" placeholder="Add location" type="text" value="Hall B, Main Campus"/>
<button class="absolute right-2 p-2 rounded-full bg-primary-fixed/50 text-primary hover:bg-primary-fixed transition-colors" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">map</span>
</button>
</div>
</div>
<!-- Reminder Setting -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase pl-2" for="reminderSetting">Reminder</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="absolute left-4 material-symbols-outlined text-primary/60">notifications_active</span>
<select class="w-full bg-surface/50 border-none rounded-full py-4 pl-12 pr-10 font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface transition-all appearance-none cursor-pointer" id="reminderSetting">
<option value="none">No reminder</option>
<option value="5">5 minutes before</option>
<option value="15">15 minutes before</option>
<option selected="" value="30">30 minutes before</option>
<option value="60">1 hour before</option>
<option value="1440">1 day before</option>
</select>
<span aria-hidden="true" class="absolute right-4 material-symbols-outlined text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Notes -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase pl-2" for="eventNotes">Notes</label>
<div class="relative">
<span aria-hidden="true" class="absolute left-4 top-4 material-symbols-outlined text-primary/60">subject</span>
<textarea class="w-full bg-surface/50 border-none rounded-lg py-4 pl-12 pr-4 font-body-sm text-body-sm text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface transition-all placeholder:text-on-surface-variant/40 resize-none" id="eventNotes" placeholder="Add any additional details or context here..." rows="3">Bring notebook and previous assignment materials.</textarea>
</div>
</div>
</form>
<!-- Save Action -->
<div class="pt-4 pb-8">
<button class="w-full py-4 bg-primary text-on-primary rounded-full font-headline-md text-body-lg flex items-center justify-center gap-2 hover:bg-primary/90 transition-all shadow-[0_8px_24px_rgba(0,53,40,0.2)] active:scale-[0.98]">
<span aria-hidden="true" class="material-symbols-outlined filled">check_circle</span>
                Confirm &amp; Save
            </button>
</div>
</main>
</body></html>
