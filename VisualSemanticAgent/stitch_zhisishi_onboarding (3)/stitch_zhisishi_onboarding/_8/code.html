<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="relative overflow-hidden">
<!-- Top App Bar (Suppressed due to context: Transactional/Modal) -->
<!-- Content Canvas -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-page relative z-10 min-h-screen">
<!-- Success Indicator Container -->
<div class="flex flex-col items-center justify-center mb-12">
<!-- Animated Checkmark/Circle (Simulated with static styling) -->
<div class="w-24 h-24 rounded-full bg-primary-fixed flex items-center justify-center mb-6 shadow-[0_8px_24px_rgba(11,77,61,0.15)] relative">
<span class="material-symbols-outlined text-primary font-display-lg" style="font-variation-settings: 'FILL' 1; font-size: 48px;">
                    check_circle
                </span>
<!-- Decorative rings -->
<div class="absolute inset-0 rounded-full border-4 border-primary-fixed-dim opacity-50 scale-125"></div>
<div class="absolute inset-0 rounded-full border-2 border-primary-fixed-dim opacity-30 scale-150"></div>
</div>
<h1 class="font-display-lg text-display-lg text-primary text-center mb-2">已加入日程</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center max-w-[280px]">
                您的学术活动已成功添加到时间线。
            </p>
</div>
</main>
<!-- Bottom Map Suggestion Modal / Card (Glassmorphism) -->
<div class="fixed bottom-0 left-0 w-full z-40 px-4 pb-8 transform transition-transform translate-y-0">
<div class="glass-panel rounded-[2rem] p-6 shadow-[0_-8px_32px_rgba(11,77,61,0.1)] flex flex-col gap-6 relative overflow-hidden">
<!-- Subtle background tint -->
<div class="absolute inset-0 bg-surface-container-high opacity-40 pointer-events-none"></div>
<div class="relative z-10 flex items-start gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">
                        location_on
                    </span>
</div>
<div class="flex-1">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1 leading-tight">识别到地点</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        活动地点位于 <span class="font-bold text-primary">上海图书馆</span>，要打开地图查看路线吗？
                    </p>
</div>
</div>
<!-- Action Buttons -->
<div class="relative z-10 flex flex-col sm:flex-row gap-4 w-full mt-2">
<button class="flex-1 bg-primary text-on-primary font-body-lg text-body-lg py-4 rounded-full shadow-[0_4px_12px_rgba(11,77,61,0.2)] hover:opacity-90 transition-opacity flex justify-center items-center gap-2">
<span class="material-symbols-outlined" style="font-size: 20px;">
                        map
                    </span>
                    打开地图
                </button>
<button class="flex-1 bg-surface-variant/50 text-on-surface font-body-lg text-body-lg py-4 rounded-full hover:bg-surface-variant/80 transition-colors flex justify-center items-center">
                    仅保存
                </button>
</div>
</div>
</div>
<!-- Decorative Background Elements -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden flex items-center justify-center">
<div class="absolute top-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary-fixed/20 blur-3xl"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[80vw] h-[80vw] rounded-full bg-surface-container-highest/40 blur-3xl"></div>
